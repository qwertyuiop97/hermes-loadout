name: reviewed configuration compatibility fix

on:
  push:
    branches: ['astra/switchboard-alpha-hardening']
    paths: ['.github/workflows/reviewed-config-fix.yml']

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'qwertyuiop97/hermes-switchboard' && github.ref == 'refs/heads/astra/switchboard-alpha-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the exact locally reviewed source patch
        shell: python {0}
        run: |
          import base64, hashlib, subprocess, zlib
          from pathlib import Path
          source = Path('dashboard/plugin_api.py')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f2439f1747ecb34cc3aa52a8f7658890511dbcf96b29e1a1e29a2a12933124a6'
          patch = zlib.decompress(base64.b64decode(''))
          assert len(patch) < 20000
          assert hashlib.sha256(patch).hexdigest() == '4326c09e3b5192c2b28c73ee5d8f4b372b623ac5e790dd01136a9409ae7f2e3b'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'cc2c3e18ec53ceec7a1493a7b18c1768a869596bca73ba5ed99db17693d94d0d'
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed == ['dashboard/plugin_api.py'], changed
      - name: Verify all backend and HTTP contracts
        run: |
          python -m pip install --quiet fastapi httpx
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --cached --check
      - name: Commit verified configuration fix to the unchanged feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin refs/heads/astra/switchboard-alpha-hardening | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve legacy client mappings and recover malformed scope metadata'
          git push origin HEAD:refs/heads/astra/switchboard-alpha-hardening
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - name: Archive the exact committed source for verification
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-config-compatibility
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
          if-no-files-found: error
