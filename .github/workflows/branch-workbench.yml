name: branch workbench

on:
  pull_request:
    paths:
      - '.github/workflows/branch-workbench.yml'

permissions:
  contents: write

jobs:
  verify-patch:
    if: github.head_ref == 'astra/switchboard-alpha-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact reviewed patch once
        id: patch
        shell: python
        run: |
          import base64, hashlib, os, subprocess, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '3ca116dbd6c2186149a7c03064751e997a6be5cdf20196ef32b729db4a4130c2'
          args = ['git', 'apply', '--unidiff-zero']
          already = subprocess.run(args + ['--reverse', '--check', '-'], input=patch, capture_output=True).returncode == 0
          if not already:
              subprocess.run(args + ['--check', '-'], input=patch, check=True)
              subprocess.run(args + ['--index', '-'], input=patch, check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('applied=' + str(not already).lower() + '\n')
      - name: Verify backend, HTTP, and static frontend
        run: |
          python -m pip install --quiet fastapi httpx
          python -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_frontend.py
          git diff --cached --check
      - name: Verify rendering and interactive client-library contracts
        run: ./tests/run_render_harness.sh
      - name: Commit verified source to feature branch only
        if: steps.patch.outputs.applied == 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin refs/heads/astra/switchboard-alpha-hardening | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add searchable client onboarding with reviewed global and project paths'
          git push origin HEAD:refs/heads/astra/switchboard-alpha-hardening
          git rev-parse HEAD
      - name: Archive verified tracked source
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-library-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
          if-no-files-found: error

  windows-evidence:
    if: github.head_ref == 'astra/switchboard-alpha-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact fixture receipt and failed undo result
        shell: python
        run: |
          import os, sys, json
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from test_plugin_api import Fixture, pa
          fx = Fixture()
          try:
              link = fx.codex / 'apple-notes'
              target = os.path.relpath(fx.home / 'skills/old/apple-notes', fx.codex)
              os.symlink(target, link, target_is_directory=True)
              result = fx.core.execute_bulk(['apple/apple-notes'], 'codex', True)
              print('APPLIED', json.dumps(result, indent=2))
              receipt = fx.core.get_bulk_receipt(result['receipt']['receipt_id'])
              print('SAVED', json.dumps(receipt, indent=2))
              print('NOW', json.dumps(fx.core._entry_snapshot(link), indent=2))
              print('UNDONE', json.dumps(pa.SkillsToggleCore(fx.home, fx.core.tools).undo_bulk(result['receipt']['receipt_id']), indent=2))
          finally:
              fx.cleanup()
