name: branch workbench

on:
  pull_request:
    paths:
      - '.github/workflows/branch-workbench.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'astra/switchboard-alpha-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: branch-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
          if-no-files-found: error
