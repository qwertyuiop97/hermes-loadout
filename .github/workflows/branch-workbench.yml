name: branch workbench

on:
  pull_request:
    paths:
      - '.github/workflows/branch-workbench.yml'

permissions:
  contents: write

jobs:
  verify-patch:
    if: github.head_ref == 'astra/switchboard-alpha-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed source and hash-verified bundled parser
        id: patch
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess, urllib.request
          encoded = ''''''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '25999fbbc3ce7da6bd467624a993eb52c1b1f930cd7911491895c7ad977fa290'
          args = ['git', 'apply', '--unidiff-zero']
          already = subprocess.run(args + ['--reverse', '--check', '-'], input=patch, capture_output=True).returncode == 0
          if not already:
              subprocess.run(args + ['--check', '-'], input=patch, check=True)
              subprocess.run(args + ['--index', '-'], input=patch, check=True)
          sources = {
              '__init__.py': '3e1370fdec8b81d9fb31c27a9eb00df32226ddd5c2ef9bebd6c546555c034a90',
              '_parser.py': 'f70f0b1b48c1edfc26659581d2f5576de7a30c7725e00348271076b1c1270e50',
              '_re.py': 'b21e2c0434603bde0a259c0d22b81d73257fa906acb79d18bf3380506a510ca0',
              '_types.py': 'f864c6d9552a929c7032ace654ee05ef26ca75d21b027b801d77e65907138b74',
          }
          for name, digest in sources.items():
              path = pathlib.Path('dashboard/_vendor/tomli') / name
              if path.exists():
                  data = path.read_bytes()
              else:
                  with urllib.request.urlopen('https://raw.githubusercontent.com/hukkin/tomli/2.2.1/src/tomli/' + name, timeout=30) as response:
                      data = response.read()
              assert hashlib.sha256(data).hexdigest() == digest, name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              subprocess.run(['git', 'add', str(path)], check=True)
          changed = subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('applied=' + str(changed).lower() + '\n')
      - name: Verify all backend, HTTP, and static frontend checks
        run: |
          python -m pip install --quiet fastapi httpx
          python -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_frontend.py
          git diff --cached --check
      - name: Verify all four React harnesses
        run: ./tests/run_render_harness.sh
      - name: Commit verified source to feature branch only
        if: steps.patch.outputs.applied == 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin refs/heads/astra/switchboard-alpha-hardening | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve native MCP policy and validate exact restore operations'
          git push origin HEAD:refs/heads/astra/switchboard-alpha-hardening
          git rev-parse HEAD
      - name: Archive verified tracked source
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-final-safety-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
          if-no-files-found: error
