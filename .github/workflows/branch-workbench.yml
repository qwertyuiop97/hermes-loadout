name: branch workbench

on:
  pull_request:
    paths:
      - '.github/workflows/branch-workbench.yml'

permissions:
  contents: write

jobs:
  verify-patch:
    if: github.head_ref == 'astra/switchboard-alpha-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact reviewed patch
        shell: python
        run: |
          import base64, hashlib, subprocess, zlib
          encoded = ''''''
          # Keep the reviewed source byte-for-byte; CI changes use the connector.
          encoded = encoded.replace('cbbfHYcTc3', 'cbbHYcTc3') if 'cbbfHYcTc3' in encoded else encoded
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '91a21ae0e2de6758c8124aa591339f829564db7df7e0310a3ee2cebfaa89628f'
          subprocess.run(['git', 'apply', '--index', '--exclude=.github/workflows/tests.yml', '-'], input=patch, check=True)
      - name: Verify backend and HTTP regressions
        run: |
          python -m pip install --quiet fastapi httpx
          python -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_frontend.py
          git diff --cached --check
      - name: Verify real React and interactive workspace
        run: ./tests/run_render_harness.sh
      - name: Commit verified source to the feature branch only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin refs/heads/astra/switchboard-alpha-hardening | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve protected entries and fail closed on unsafe config writes'
          git push origin HEAD:refs/heads/astra/switchboard-alpha-hardening
          git rev-parse HEAD
      - name: Archive verified source and render dependencies
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          tar -C /tmp/skt-front -czf "$RUNNER_TEMP/render-deps.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: verified-safety-source
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/render-deps.tar.gz
          retention-days: 1
          if-no-files-found: error
