name: branch workbench

on:
  pull_request:
    paths:
      - '.github/workflows/branch-workbench.yml'

permissions:
  contents: write

jobs:
  verify-patch:
    if: github.head_ref == 'astra/switchboard-alpha-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact reviewed patch once
        id: patch
        shell: python
        run: |
          import base64, hashlib, os, subprocess, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '8266f1fa1047f15177424d886989e17221fe9752e350496e5e998f7d3f173e1c'
          args = ['git', 'apply', '--unidiff-zero']
          already = subprocess.run(args + ['--reverse', '--check', '-'], input=patch, capture_output=True).returncode == 0
          if not already:
              subprocess.run(args + ['--check', '-'], input=patch, check=True)
              subprocess.run(args + ['--index', '-'], input=patch, check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('applied=' + str(not already).lower() + '\n')
      - name: Verify backend, HTTP, and static frontend
        run: |
          python -m pip install --quiet fastapi httpx
          python -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_frontend.py
          git diff --cached --check
      - name: Verify React rendering and mutation recovery
        run: ./tests/run_render_harness.sh
      - name: Commit verified source to feature branch only
        if: steps.patch.outputs.applied == 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin refs/heads/astra/switchboard-alpha-hardening | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add a documented client catalog and explicitly scoped targets'
          git push origin HEAD:refs/heads/astra/switchboard-alpha-hardening
          git rev-parse HEAD
      - name: Archive verified tracked source
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-catalog-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
          if-no-files-found: error
