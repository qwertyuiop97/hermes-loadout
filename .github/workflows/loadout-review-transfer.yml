name: Apply verified Loadout audit patch

# Temporary delivery helper. It runs only on the audit branch, checks the exact
# patch and resulting tree, tests the changes, and removes itself before commit.
# Its only push targets the audit branch; it never merges, releases or force-pushes.
on:
  push:
    branches: [audit/reliability-2026-09-16]
permissions:
  contents: read
jobs:
  verified-audit:
    if: github.repository == 'qwertyuiop97/hermes-loadout' && github.ref == 'refs/heads/audit/reliability-2026-09-16'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify, apply, and stage the exact reviewed patch
        env:
          EXPECTED_TREE: 2440ecd99d76372ae4ff1a915ad504f9bc7065aa
        run: |
          test "$(git rev-parse HEAD^)" = 86325fdb27e4f10b35d4fa20128f64b1f3faeb46
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = ''.join(Path('.github/loadout-transfer-' + part + '.b64').read_text() for part in ('1', '2'))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c63283a7548eb56db3190571e1eb4d2c550d2f7e2cd5686957b86ed559545ee4'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          # Correct the new test's callback shape, SearchField receives a string.
          harness = Path('tests/loadout_harness_body.mjs')
          source = harness.read_text()
          for value in ('draft-204', ''):
              before = "await change(tree, 'Find a capability', " + repr(value) + ")"
              after = "await act(async () => labeled(tree, 'Find a capability').props.onChange(" + repr(value) + "))"
              assert source.count(before) == 1
              source = source.replace(before, after)
          harness.write_text(source)
          PY
          git rm .github/loadout-transfer-1.b64 .github/loadout-transfer-2.b64 .github/workflows/loadout-review-transfer.yml
          git add dashboard desktop docs tests
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          python tests/check_repository.py
      - name: Backend regressions
        run: |
          python -m pip install --quiet -r tests/requirements-http.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Read pinned official Hermes SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: NousResearch/hermes-agent
          ref: d9e64e916500fca93920b2fae31b362628f042e6
          path: .ci-hermes-sdk
          sparse-checkout: apps/desktop/src/sdk
          persist-credentials: false
      - name: Verify SDK and frontend syntax
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          source = Path('.ci-hermes-sdk/apps/desktop/src/sdk/index.ts').read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() == 'd6cbf207b65d8402cf9ae3151b00dd2e58482bc2'
          PY
          python tests/check_frontend.py --require-sdk --sdk-index .ci-hermes-sdk/apps/desktop/src/sdk/index.ts
      - name: Real React behavioral harnesses
        run: ./tests/run_render_harness.sh
      - name: Commit only the verified tree to the audit branch
        env:
          EXPECTED_TREE: 2440ecd99d76372ae4ff1a915ad504f9bc7065aa
        run: |
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: protect saved loadouts and improve capture, review, and editor reliability'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:refs/heads/audit/reliability-2026-09-16
