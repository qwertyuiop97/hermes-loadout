name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP test dependencies
        run: python -m pip install --quiet fastapi httpx
      - name: All backend and HTTP regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  python39-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Python 3.9 stdlib-only core compatibility gate
        # HTTP tests skip without FastAPI/httpx; the matrix above runs them.
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SDK-constraint static checks
        run: python3 tests/check_frontend.py
        # SDK cross-check warns when the Hermes source tree is absent.
        # Syntax, imports, tokens, and other checks remain hard failures.
      - name: Render and interactive workspace harnesses
        run: ./tests/run_render_harness.sh
      - name: Archive the tested source
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-source
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/source-commit.txt
          retention-days: 3
          if-no-files-found: error
