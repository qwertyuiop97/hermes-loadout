name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --quiet -r tests/requirements-http.txt
      - name: Backend, HTTP, and filesystem regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  python39-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9'
      - name: Python 3.9 core without dependency installation
        # HTTP tests are covered by the matrix; missing YAML restore fails closed.
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read pinned official Hermes SDK exports
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NousResearch/hermes-agent
          ref: d9e64e916500fca93920b2fae31b362628f042e6
          path: .ci-hermes-sdk
          sparse-checkout: apps/desktop/src/sdk
          persist-credentials: false
      - name: Verify SDK source identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          source = Path('.ci-hermes-sdk/apps/desktop/src/sdk/index.ts').read_bytes()
          identity = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
          assert identity == 'd6cbf207b65d8402cf9ae3151b00dd2e58482bc2', identity
      - name: Required real SDK export and ESM checks
        run: python tests/check_frontend.py --require-sdk --sdk-index .ci-hermes-sdk/apps/desktop/src/sdk/index.ts
      - name: Render and interactive workspace harnesses
        run: ./tests/run_render_harness.sh
      - name: Verify tracked source hygiene
        run: python tests/check_repository.py
      - name: Archive reviewed source and SDK evidence
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          cp .ci-hermes-sdk/apps/desktop/src/sdk/index.ts "$RUNNER_TEMP/hermes-sdk-index.ts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tested-source
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/hermes-sdk-index.ts
          retention-days: 3
          if-no-files-found: error
